name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Lint & Test (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Validate browser extension syntax & fixed ID
        run: |
          for f in apps/browser-extension/*.js; do
            node --check "$f"
          done
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const manifest = JSON.parse(fs.readFileSync("apps/browser-extension/manifest.json", "utf8"));
            const digest = crypto.createHash("sha256").update(Buffer.from(manifest.key, "base64")).digest();
            const map = "abcdefghijklmnop";
            let id = "";
            for (let i = 0; i < 16; i++) {
              id += map[digest[i] >> 4] + map[digest[i] & 15];
            }
            if (id !== "ianpdijhflnmmhbmjdhiombdghhpfkmg") {
              throw new Error("Extension ID mismatch: " + id);
            }
            console.log("Verified fixed Extension ID:", id);
          '

      - name: Typecheck & build desktop frontend
        run: |
          npm --prefix apps/desktop run typecheck
          npm --prefix apps/desktop run build

      - name: Run Rust workspace tests
        run: cargo test --workspace
