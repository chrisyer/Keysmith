name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Build, Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install npm dependencies
        run: npm ci

      - name: Validate browser extension syntax, manifests & WebAuthn hooks
        run: node scripts/test-extension.mjs

      - name: Run frontend unit tests, typecheck & build
        run: |
          npm --prefix apps/desktop run test
          npm --prefix apps/desktop run typecheck
          npm --prefix apps/desktop run build

      - name: Run Rust workspace tests
        run: cargo test --workspace
