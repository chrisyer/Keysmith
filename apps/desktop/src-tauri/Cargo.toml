[package]
name = "keysmith-desktop"
version = "0.1.3"
edition = "2021"
description = "Keysmith macOS desktop shell powered by Tauri v2"

[lib]
name = "keysmith_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keysmith-core = { path = "../../../crates/keysmith-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.41", features = ["full"] }
url = "2.5"
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSColor", "NSImage", "NSImageRep", "NSPasteboard", "NSResponder", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSDistributedNotificationCenter", "NSError", "NSNotification", "NSOperation", "NSString", "block2"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LABase", "LABiometryType", "LAContext", "LAError", "block2"] }
security-framework = "3.7"
window-vibrancy = "0.8"

[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = "3"
