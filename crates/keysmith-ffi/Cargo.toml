[package]
name = "keysmith-ffi"
version = "0.1.4"
edition = "2021"
license = "MPL-2.0"
description = "UniFFI cross-platform FFI bindings for Keysmith iOS/iPadOS & mobile"

[lib]
name = "keysmith_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
keysmith-core = { path = "../keysmith-core" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.41", features = ["rt", "rt-multi-thread", "sync"] }
uniffi = { version = "0.28", features = ["cli"] }
uuid = { version = "1.11", features = ["v4"] }
zeroize = "1.8"

[dev-dependencies]
sha2 = "0.10"
